name: Java CI with Maven

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Pokretanje testova
    runs-on: ubuntu-latest

    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v4

      - name: Podesavanje JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pokretanje jedinicnih testova
        run: mvn test

      - name: Cuvanje rezultata testova
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: target/surefire-reports/

  build:
    name: Izgradnja aplikacije
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Preuzimanje koda (Checkout)
        uses: actions/checkout@v4

      - name: Podesavanje JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Izgradnja JAR fajla
        run: mvn clean package -DskipTests

      - name: Cuvanje JAR artifakta
        uses: actions/upload-artifact@v4
        with:
          name: biblioteka-jar
          path: target/*.jar