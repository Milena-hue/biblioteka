name: Build, Test & SonarCloud

on:
  push:
    branches: [ "main", "feature/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-analyze:
    name: Build, Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Potrebno za SonarCloud analizu

      - name: Postavi JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Pokreni testove i generiši JaCoCo izvestaj
        run: mvn verify

      - name: SonarCloud analiza
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn sonar:sonar
          -Dsonar.projectKey=Milena-hue_biblioteka
          -Dsonar.organization=milena-hue
          -Dsonar.host.url=https://sonarcloud.io